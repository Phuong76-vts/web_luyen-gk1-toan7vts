<!-- BẢN NHÁP — cô Phương duyệt trước khi phát cho học sinh. Ngân hàng câu hỏi tự sinh theo ma trận Toán 7 giữa HK1 (2026-2027). -->
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#1e1b4b;--mut:#6b6a8f;--p:#7c3aed;--p2:#a78bfa;--ok:#16a34a;--okbg:#dcfce7;--bad:#e11d48;--badbg:#ffe4e6;--gold:#f59e0b;--sky:#0ea5e9;--pink:#ec4899;--r:20px;--sh:0 6px 0 rgba(76,29,149,.14),0 14px 30px rgba(76,29,149,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Baloo 2","Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 500px at 10% -10%,#e9d5ff 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#bae6fd 0,transparent 55%),var(--bg);min-height:100vh;font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0}
sup{font-size:.7em;line-height:0}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:2px solid #ede9fe}
.top-in{max-width:1040px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--p);cursor:pointer;white-space:nowrap}
.logo b{font-size:26px}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
.nav button{background:transparent;color:var(--mut);padding:8px 12px;border-radius:12px;font-weight:700;white-space:nowrap;font-size:15px}
.nav button:hover{background:#f5f3ff}.nav button.on{background:var(--p);color:#fff}
.chip{display:flex;align-items:center;gap:6px;background:#fef3c7;color:#92400e;border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.snd{background:#f5f3ff;border-radius:50%;width:36px;height:36px;font-size:18px}
main{max-width:1040px;margin:0 auto;padding:18px 14px 90px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#6d28d9,#7c3aed 45%,#0ea5e9);color:#fff;border-radius:28px;padding:26px 28px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero>div{position:relative;z-index:1}.hero:before{pointer-events:none;content:"+ − × ÷ π ² ³ ∈";position:absolute;inset:auto -10px -18px auto;font-size:84px;font-weight:800;opacity:.10;letter-spacing:8px;white-space:nowrap}
.hero h1{margin:0 0 6px;font-size:34px;line-height:1.15}
.hero p{margin:0 0 14px;opacity:.95}
.hero .tag{display:inline-block;background:rgba(255,255,255,.22);padding:3px 12px;border-radius:999px;font-weight:700;font-size:14px;margin-bottom:8px}
.name-in{display:flex;gap:8px;flex-wrap:wrap}
.name-in input{flex:1;min-width:160px;border:0;border-radius:14px;padding:11px 14px;font:inherit;font-weight:700;color:var(--ink)}
.owl{font-size:96px;text-align:center;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
.bubble{background:#fff;color:var(--ink);border-radius:18px;padding:10px 14px;font-weight:700;font-size:15px;position:relative;margin-top:6px}
.bubble:before{content:"";position:absolute;top:-8px;left:50%;border:8px solid transparent;border-bottom-color:#fff;border-top:0;margin-left:-8px}
.btn{background:var(--p);color:#fff;border-radius:16px;padding:12px 22px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #5b21b6;transition:.12s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5b21b6}
.btn.gold{background:var(--gold);box-shadow:0 5px 0 #b45309}.btn.gold:active{box-shadow:0 2px 0 #b45309}
.btn.green{background:var(--ok);box-shadow:0 5px 0 #166534}.btn.green:active{box-shadow:0 2px 0 #166534}
.btn.ghost{background:#fff;color:var(--p);box-shadow:0 5px 0 #ddd6fe;border:2px solid #ddd6fe}
.btn.sm{padding:7px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.xpbar{height:14px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#fde047,#f59e0b);border-radius:99px;transition:width .6s}
h2{font-size:24px;margin:26px 0 12px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);border:2px solid #ede9fe}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--p2)}
.mode .em{font-size:44px}.mode h3{margin:6px 0 2px;font-size:20px}.mode p{margin:0;color:var(--mut);font-size:15px;line-height:1.35}
.zone{position:relative;overflow:hidden}
.zone .zh{display:flex;gap:12px;align-items:center}
.zone .ze{font-size:46px;width:70px;height:70px;border-radius:20px;display:grid;place-items:center;flex:none}
.zone h3{margin:0;font-size:21px}.zone small{color:var(--mut);display:block;line-height:1.3}
.lv{display:flex;align-items:center;gap:10px;margin-top:10px;background:#faf9ff;border:2px solid #ede9fe;border-radius:14px;padding:8px 10px;cursor:pointer;transition:.12s}
.lv:hover{border-color:var(--p);background:#f5f3ff}
.lv b{flex:1;font-size:16px}.lv span.t{font-size:13px;color:var(--mut);font-weight:700}
.stars{letter-spacing:2px;font-size:20px;color:#d1d5db}.stars .f{color:var(--gold);text-shadow:0 2px 0 #b45309}
.z-A .ze{background:#dbeafe}.z-B .ze{background:#ffedd5}.z-C .ze{background:#fce7f3}.z-D .ze{background:#dcfce7}
.qwrap{max-width:760px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{background:#fff;border:2px solid #ede9fe;width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--mut)}
.pbar{flex:1;height:16px;background:#e9e5ff;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--sky));border-radius:99px;transition:width .4s}
.combo{font-weight:800;color:#ea580c;min-width:70px;text-align:right}
.qcard{padding:22px}
.qlab{display:inline-block;background:#ede9fe;color:var(--p);font-weight:800;font-size:13px;border-radius:99px;padding:2px 12px;margin-bottom:8px}
.qtxt{font-size:20px;font-weight:700;line-height:1.5;margin:4px 0 12px}
.fig{width:min(100%,300px);display:block;margin:6px auto 12px;background:#faf9ff;border-radius:16px;border:2px dashed #ddd6fe}
.fig .sh{fill:#fde68a;stroke:#6d28d9;stroke-width:3;stroke-linejoin:round}
.fig .dg{stroke:#ef4444;stroke-width:2;stroke-dasharray:5 4}
.fig .lb{font:800 14px system-ui,sans-serif;fill:#1e1b4b}.fig .dm{font:800 13px system-ui,sans-serif;fill:#be185d}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid #e5e1ff;border-radius:16px;padding:12px 14px;font-weight:700;font-size:18px;color:var(--ink);box-shadow:0 4px 0 #e5e1ff;transition:.1s;width:100%}
.opt:hover{border-color:var(--p2);transform:translateY(-1px)}
.opt .L{flex:none;width:34px;height:34px;border-radius:10px;background:#ede9fe;color:var(--p);display:grid;place-items:center;font-weight:800}
.opt.sel{border-color:var(--p);background:#f5f3ff;box-shadow:0 4px 0 var(--p2)}.opt.sel .L{background:var(--p);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg);box-shadow:0 4px 0 #86efac}.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg);box-shadow:0 4px 0 #fda4af;animation:shake .35s}.opt.wrong .L{background:var(--bad);color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sain{display:flex;gap:10px;align-items:center}
.sain input,.ta{flex:1;font:inherit;font-weight:800;font-size:22px;border:3px solid #e5e1ff;border-radius:16px;padding:12px 16px;color:var(--ink);min-width:0;width:100%}
.sain input:focus,.ta:focus{outline:0;border-color:var(--p)}
.sain input.right{border-color:var(--ok);background:var(--okbg)}.sain input.wrong{border-color:var(--bad);background:var(--badbg)}
.sain .u{font-weight:800;color:var(--mut)}
.tfrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:3px solid #e5e1ff;border-radius:16px;padding:10px 12px;margin-bottom:10px;background:#fff}
.tfrow .t{font-weight:700;font-size:17.5px}
.tfrow .lv2{display:inline-block;font-size:11px;font-weight:800;color:var(--mut);background:#f3f4f6;border-radius:6px;padding:0 6px;margin-right:6px}
.tfbtn{display:flex;gap:6px}
.tfbtn button{background:#f3f4f6;color:var(--mut);font-weight:800;border-radius:12px;padding:8px 14px;border:2px solid transparent}
.tfbtn button.sel.T{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.tfbtn button.sel.F{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.tfrow.right{border-color:var(--ok)}.tfrow.wrong{border-color:var(--bad)}
.tfrow .why{grid-column:1/-1;font-size:15px;color:var(--mut);font-weight:600;border-top:1px dashed #ddd6fe;padding-top:6px}
.fb{margin-top:14px;border-radius:18px;padding:14px 16px;font-weight:700;animation:pop .3s}
.fb.ok{background:var(--okbg);color:#14532d}.fb.no{background:var(--badbg);color:#881337}
.fb .exp{display:block;margin-top:6px;font-weight:600;color:var(--ink);font-size:16px}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.res{text-align:center}.res .big{font-size:64px}
.res .score{font-size:46px;font-weight:800;color:var(--p)}
.statrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.stat{background:#faf9ff;border:2px solid #ede9fe;border-radius:16px;padding:8px 16px}.stat b{display:block;font-size:22px}.stat span{font-size:13px;color:var(--mut);font-weight:700}
.bar{height:12px;background:#eee9ff;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#0ea5e9);border-radius:99px}
.exam-head{position:sticky;top:8px;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:2px solid #ede9fe;border-radius:16px;padding:8px 12px;display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.nums{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nums a{width:28px;height:28px;border-radius:8px;background:#f3f4f6;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--mut);text-decoration:none}
.nums a.d{background:var(--p);color:#fff}
.sec{background:linear-gradient(90deg,#ede9fe,transparent);border-left:6px solid var(--p);padding:6px 14px;border-radius:10px;font-weight:800;margin:22px 0 12px}
.eq{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;border:2px solid #ede9fe;scroll-margin-top:130px}
.eq .qtxt{font-size:18px}
.eq.right{border-color:var(--ok)}.eq.wrong{border-color:var(--bad)}
.examlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.examlist button{background:#fff;border:3px solid #ddd6fe;border-radius:16px;padding:10px;font-weight:800;color:var(--p);box-shadow:0 4px 0 #ddd6fe;font-size:16px}
.examlist button small{display:block;color:var(--mut);font-size:12px}
.examlist button.done{border-color:var(--ok);color:var(--ok);box-shadow:0 4px 0 #86efac}
.tag-l{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:1px 10px;margin-left:6px;background:#fef3c7;color:#92400e}
.tlc{margin-bottom:16px}
.tlc .sol{background:#f0fdf4;border:2px solid #bbf7d0;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:17px;line-height:1.7}
.tlc .hint{background:#fffbeb;border:2px dashed #fcd34d;border-radius:12px;padding:8px 12px;margin-top:8px;font-weight:600}
.self{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.self button{border-radius:12px;padding:7px 12px;font-weight:800;background:#f3f4f6;color:var(--ink);border:2px solid transparent}
.self button.on{border-color:var(--p);background:#ede9fe;color:var(--p)}
.ta{font-size:16px;font-weight:600;min-height:70px;resize:vertical;margin-top:8px}
.game{text-align:center}
.timer{height:14px;background:#e9e5ff;border-radius:99px;overflow:hidden;margin:8px 0 14px}.timer i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#facc15,#f43f5e);width:100%;transform-origin:left}
.bignum{font-size:64px;font-weight:800;letter-spacing:2px;margin:6px 0;color:var(--p)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.yn button{font-size:26px;padding:20px;border-radius:20px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.yes{background:var(--ok);color:#fff}.no{background:var(--bad);color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bd{text-align:center;padding:14px 8px;border-radius:18px;background:#fff;border:2px solid #ede9fe}
.bd .e{font-size:40px;filter:grayscale(1);opacity:.35}.bd.got{border-color:var(--gold);background:#fffbeb}.bd.got .e{filter:none;opacity:1;animation:bob 3s infinite}
.bd b{display:block;font-size:15px}.bd small{color:var(--mut);font-size:12.5px;line-height:1.25;display:block}
table.m{width:100%;border-collapse:collapse;font-size:15px}
table.m th,table.m td{border:2px solid #ede9fe;padding:6px 8px;text-align:center}
table.m th{background:#f5f3ff}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:#1e1b4b;color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;z-index:60;transition:.4s;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.note{background:#fffbeb;border:2px dashed #fcd34d;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:600}
.muted{color:var(--mut)}.center{text-align:center}
.back{margin-bottom:10px}
@media(max-width:760px){
  .hero{grid-template-columns:1fr;padding:20px}.hero h1{font-size:27px}.owl{font-size:70px}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}
  .top-in{flex-wrap:wrap;gap:6px}.nav{order:3;width:100%;margin-left:0}
  .qtxt{font-size:18px}.exam-head{top:98px}.bignum{font-size:48px}
  .tfrow{grid-template-columns:1fr}.tfbtn{justify-content:flex-end}
}
@media(max-width:480px){.g3,.g4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.nav,#fx,.foot,.btn{display:none}}

/* ===== NÂNG CẤP GIAO DIỆN V2 ===== */
body{background:linear-gradient(180deg,#ede9fe 0,#f5f3ff 320px,#f4f1ff 100%);position:relative}
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bgfx span{position:absolute;font-weight:800;color:#7c3aed;opacity:.07;animation:flo linear infinite;user-select:none}
@keyframes flo{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-34px) rotate(12deg)}100%{transform:translateY(0) rotate(0)}}
.top{position:relative;z-index:30}main{position:relative;z-index:2}
.top{background:rgba(255,255,255,.82);border-bottom:0;box-shadow:0 4px 24px rgba(91,33,182,.10)}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,#7c3aed,#0ea5e9,#22c55e,#f59e0b,#ec4899,#7c3aed);background-size:200% 100%;animation:rb 8s linear infinite}
@keyframes rb{to{background-position:200% 0}}
.logo{font-size:21px}.logo b{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#0ea5e9);font-size:22px;box-shadow:0 3px 0 #5b21b6}
.nav button.on{background:linear-gradient(135deg,#7c3aed,#6366f1);box-shadow:0 3px 0 #4c1d95}
.chip{background:linear-gradient(135deg,#fef3c7,#fde68a);box-shadow:0 2px 0 #f59e0b}
/* HERO */
.hero{background:linear-gradient(120deg,#5b21b6,#7c3aed 35%,#2563eb 70%,#0ea5e9);background-size:200% 200%;animation:gr 12s ease infinite;border-radius:32px;padding:34px 34px;box-shadow:0 8px 0 #4c1d95,0 24px 50px rgba(76,29,149,.28)}
@keyframes gr{50%{background-position:100% 50%}}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.22),transparent 40%),radial-gradient(circle at 10% 100%,rgba(250,204,21,.25),transparent 40%);font-size:0;opacity:1;pointer-events:none}
.hero .sym{position:absolute;font-weight:800;color:#fff;opacity:.13;pointer-events:none;animation:flo 7s ease-in-out infinite}
.hero h1{font-size:38px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#fde047,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.pills span{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px;backdrop-filter:blur(4px)}
.mascot{width:200px;max-width:100%;display:block;margin:0 auto;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 0 rgba(0,0,0,.16))}
.mascot .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mascot.sm{width:110px}
.bubble{box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn{background:linear-gradient(180deg,#8b5cf6,#7c3aed);position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:.5s}
.btn:hover:after{left:130%}
.btn.gold{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#451a03}
.btn.green{background:linear-gradient(180deg,#34d399,#16a34a)}
.btn.ghost{background:#fff}
/* MODE CARDS */
.mode{padding:20px;position:relative;overflow:hidden}
.mode .em{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:40px;margin-bottom:8px;box-shadow:0 5px 0 rgba(0,0,0,.14);transform:rotate(-4deg);transition:.2s}
.mode:hover .em{transform:rotate(4deg) scale(1.08)}
.mode:after{content:"➜";position:absolute;right:16px;bottom:12px;font-size:22px;font-weight:800;color:var(--p2);transition:.2s}
.mode:hover:after{right:10px;color:var(--p)}
.m1 .em{background:linear-gradient(135deg,#a78bfa,#6366f1)}.m2 .em{background:linear-gradient(135deg,#fbbf24,#f97316)}.m3 .em{background:linear-gradient(135deg,#f472b6,#ec4899)}
.m4 .em{background:linear-gradient(135deg,#34d399,#0ea5e9)}.m5 .em{background:linear-gradient(135deg,#60a5fa,#6366f1)}.m6 .em{background:linear-gradient(135deg,#fde047,#f59e0b)}
.card.click:hover{box-shadow:0 8px 0 rgba(76,29,149,.16),0 22px 40px rgba(76,29,149,.16)}

    exp:'Đổi các số về dạng thập phân: '+arr.map(a=>(isDec(a)?dec(fval(a)):fh(a))+' ≈ '+dec(Math.round(fval(a)*1000)/1000)).join('; ')+'. Từ đó '+(mx?'lớn nhất':'nhỏ nhất')+' là '+(isDec(best)?dec(fval(best)):fh(best))+'.'})},'tt');
add('A',1,'mc',()=>{ /* số hữu tỉ âm / dương */
  const a=rnd(2,9),b=rnd(2,9);const neg=Math.random()<.6;
  if(neg)return mc({z:'A',l:1,q:'Số nào sau đây là số hữu tỉ <b>âm</b>?',right:fu(a,-b),wrong:[fu(-a,-b),fu(0,b),dec(a/b+0.1)],exp:'Số hữu tỉ âm là số nhỏ hơn 0. Ta có '+fu(a,-b)+' = '+fh(R(-a,b))+' < 0; còn '+fu(-a,-b)+' = '+fh(R(a,b))+' > 0, '+fu(0,b)+' = 0 và '+dec(a/b+0.1)+' > 0.'});
  return mc({z:'A',l:1,q:'Số nào sau đây là số hữu tỉ <b>dương</b>?',right:fu(-a,-b),wrong:[fu(a,-b),fu(0,b),dec(-a/b-0.1)],exp:'Số hữu tỉ dương là số lớn hơn 0. Ta có '+fu(-a,-b)+' = '+fh(R(a,b))+' > 0, các số còn lại là số âm hoặc bằng 0.'})},'tt');

const dsp=r=>isDec(r)&&r.d!==1?dec(fval(r)):fh(r);               /* hiển thị: thập phân nếu hữu hạn */
const ansR=r=>({ans:fval(r),at:isDec(r)?toDec(r):fh(r)});          /* đáp án hữu tỉ: giá trị + chuỗi hiển thị */
const SA=(z,l,q,r,exp,extra)=>{const a=ansR(r);return sa(Object.assign({z,l,q,ans:a.ans,at:a.at,exp},extra||{}))};

add('A',2,'mc',()=>{ /* so sánh hai số hữu tỉ */
  let x,y;do{x=rq([3,4,5,6,7,8],9);y=rq([3,4,5,6,7,8],9)}while(x.d===y.d&&Math.random()<.7);
  if(Math.random()<.2)y=R(x.n*2,x.d*2);
  const c=fcmp(x,y);const right=c<0?'<':c>0?'>':'=';
  const L=x.d*y.d/gcd(x.d,y.d);
  return mc({z:'A',l:2,q:'Điền dấu thích hợp vào chỗ trống: &nbsp; '+fh(x)+' &nbsp;…&nbsp; '+fh(y),right,wrong:['<','>','=','≤'].filter(s=>s!==right),
    exp:'Quy đồng mẫu số (MSC = '+L+'): '+fh(x)+' = '+fu(x.n*L/x.d,L)+' và '+fh(y)+' = '+fu(y.n*L/y.d,L)+'. So sánh hai tử số: '+(x.n*L/x.d)+(c<0?' < ':c>0?' > ':' = ')+(y.n*L/y.d)+'. Vậy '+fh(x)+' '+right+' '+fh(y)+'.'})},'ss');
add('A',2,'mc',()=>{ /* sắp xếp tăng dần */
  let a;do{a=[rq([2,3,4,5,6],8),rq([2,3,4,5,6],8),rq([2,3,4,5,6],8)]}while(fcmp(a[0],a[1])===0||fcmp(a[0],a[2])===0||fcmp(a[1],a[2])===0);
  const s=a.slice().sort(fcmp);const txt=l=>l.map(fh).join(' &lt; ');
  const wrongs=[[s[2],s[1],s[0]],[s[1],s[0],s[2]],[s[0],s[2],s[1]],[s[1],s[2],s[0]],[s[2],s[0],s[1]]].map(txt);
  return mc({z:'A',l:2,q:'Sắp xếp các số '+a.map(fh).join('; ')+' theo thứ tự <b>tăng dần</b> ta được',right:txt(s),wrong:wrongs,
    exp:'Giá trị thập phân gần đúng: '+a.map(x=>fh(x)+' ≈ '+dec(Math.round(fval(x)*100)/100)).join('; ')+'. Xếp từ bé đến lớn: '+txt(s)+'.'})},'xep');
add('A',2,'mc',()=>{ /* trục số */
  const parts=pick([2,3,4,5]);const lo=rnd(-3,-1);const m=rnd(1,3*parts-1);if(m%parts===0)return G.A[2][2]();
  const val=R(lo*parts+m,parts);
  const wrong=[R(lo*parts+m+1,parts),R(lo*parts+m-1,parts),R(-(lo*parts+m),parts),R(lo*parts+m+2,parts)].filter(x=>!feq(x,val));
  return mc({z:'A',l:2,q:'Điểm M trên trục số biểu diễn số hữu tỉ nào?',svg:SV.wrap(SV.numline(lo,parts,m,'M')),right:fh(val),wrong:wrong.map(fh),
    exp:'Mỗi đơn vị trên trục được chia thành '+parts+' phần bằng nhau. Điểm M cách gốc '+lo+' là '+m+' phần, tức nằm ở vị trí '+fh(R(lo*parts,parts))+' + '+fraw(m,parts)+' = '+fh(val)+'.'})},'tru');
add('A',2,'sa',()=>{ /* đếm số nguyên giữa hai số hữu tỉ */
  const a=R(-rnd(5,40),rnd(2,6)),b=R(rnd(5,40),rnd(2,6));
  let c=0;const ls=[];for(let k=-20;k<=20;k++){if(k>fval(a)&&k<fval(b)){c++;ls.push(k)}}
  return sa({z:'A',l:2,q:'Có bao nhiêu số nguyên nằm giữa hai số hữu tỉ '+fh(a)+' và '+fh(b)+'?',ans:c,exp:fh(a)+' ≈ '+dec(Math.round(fval(a)*100)/100)+' và '+fh(b)+' ≈ '+dec(Math.round(fval(b)*100)/100)+'. Các số nguyên nằm giữa là: '+ls.join('; ')+' — tất cả '+c+' số.',hint:'Đổi hai số về dạng số thập phân rồi liệt kê các số nguyên ở giữa.'})},'dem');
add('A',2,'tf',()=>{
  let a,b;do{a=rq([3,4,5,7],9);b=rq([3,4,5,7],9)}while(fcmp(a,b)===0);
  const c=fcmp(a,b);
  return tf({z:'A',l:2,q:'Cho hai số hữu tỉ '+fh(a)+' và '+fh(b)+'. Mỗi phát biểu sau đúng hay sai?',items:[
    tfv(1,'Số đối của '+fh(a)+' là '+fh(fneg(a)),true,'Đúng: số đối của a là −a.'),
    tfv(2,fh(a)+(c<0?' &gt; ':' &lt; ')+fh(b)+'',c===0?true:false,c===0?'Đúng.':'Sai: '+fh(a)+' ≈ '+dec(fval(a))+', '+fh(b)+' ≈ '+dec(fval(b))+' nên '+fh(a)+(c<0?' < ':c>0?' > ':' = ')+fh(b)+'.'),
    tfv(2,fh(a)+(c<0?' &lt; ':c>0?' &gt; ':' = ')+fh(b),true,'Đúng: '+fh(a)+(c<0?' < ':c>0?' > ':' = ')+fh(b)+'.'),
    tfv(3,'Trên trục số, điểm biểu diễn '+fh(a)+' nằm '+(c<0?'bên trái':'bên phải')+' điểm biểu diễn '+fh(b),true,'Đúng: số nhỏ hơn nằm bên trái.')]})},'tfa');

/* A3 — vận dụng */
add('A',3,'sa',()=>{ /* n nguyên để k/(n-a) nguyên */
  const k=pick([6,10,12,15,18,20,24,30,35]);const a=rnd(1,6);
  const d=divs(k);const cnt=2*d.length;
  return sa({z:'A',l:3,q:'Cho biểu thức M = '+fraw(k,'n '+MN+' '+a)+' với n là số nguyên, n ≠ '+a+'. Có bao nhiêu giá trị nguyên của n để M có giá trị là một số nguyên?',ans:cnt,exp:'M nguyên ⇔ (n − '+a+') là ước của '+k+'. Số '+k+' có '+d.length+' ước dương ('+d.join('; ')+') và '+d.length+' ước âm, tức '+cnt+' ước. Mỗi ước cho đúng một giá trị của n nên có '+cnt+' giá trị.',hint:'M là số nguyên khi (n − '+a+') là ước (cả dương và âm) của '+k+'.'})},'nguyen');
add('A',3,'sa',()=>{
  const x=R(-rnd(11,99),rnd(3,9));const big=Math.random()<.5;
  const v=fval(x);
  return sa({z:'A',l:3,q:'Tìm số nguyên '+(big?'<b>lớn nhất</b>':'<b>nhỏ nhất</b>')+' x thoả mãn '+(big?'x &lt; ':'x &gt; ')+fh(x)+'.',ans:big?Math.ceil(v)-1:Math.floor(v)+1,exp:fh(x)+' ≈ '+dec(Math.round(v*100)/100)+'. '+(big?'Số nguyên lớn nhất nhỏ hơn số này là ':'Số nguyên nhỏ nhất lớn hơn số này là ')+(big?Math.ceil(v)-1:Math.floor(v)+1)+'.',hint:'Đổi số hữu tỉ về số thập phân rồi tìm số nguyên liền kề.'})},'ngmax');
add('A',3,'sa',()=>{ /* nhiệt độ */
  const t0=-rnd(2,9),up=rnd(15,40)/10,h=rnd(2,5),down=rnd(5,25)/10;
  const res=Math.round((t0+up*h-down)*10)/10;
  return sa({z:'A',l:3,q:'Nhiệt độ lúc 6 giờ sáng ở Sa Pa là '+dec(t0)+' °C. Mỗi giờ sau đó nhiệt độ tăng '+dec(up)+' °C và sau '+h+' giờ thì nhiệt độ lại giảm đột ngột '+dec(down)+' °C do có mây. Nhiệt độ lúc đó là bao nhiêu độ C?',ans:res,unit:'°C',exp:'Nhiệt độ sau '+h+' giờ: '+dec(t0)+' + '+h+' · '+dec(up)+' = '+dec(t0+up*h)+' (°C). Sau khi giảm: '+dec(t0+up*h)+' − '+dec(down)+' = '+dec(res)+' (°C).'})},'tt');

/* ======== HÀNH TINH B — PHÉP TÍNH VỚI SỐ HỮU TỈ ======== */
add('B',1,'mc',()=>{ /* luỹ thừa */
  const x=pick(['x','a','y']);const m=rnd(2,7),n=rnd(2,6);const k=rnd(1,3);
  const t=rnd(1,4);
  if(t===1)return mc({z:'B',l:1,q:'Với '+x+' ≠ 0, kết quả của phép tính '+x+sup(m)+' · '+x+sup(n)+' là',right:x+sup(m+n),wrong:[x+sup(m*n),x+sup(m+n+1),x+sup(m+n-1),x+sup(m+n+2)],exp:'Nhân hai luỹ thừa cùng cơ số: giữ nguyên cơ số, cộng số mũ: '+x+sup(m)+' · '+x+sup(n)+' = '+x+sup(m+'+'+n)+' = '+x+sup(m+n)+'.'});
  if(t===2){const a=m+n;return mc({z:'B',l:1,q:'Với '+x+' ≠ 0, kết quả của phép tính '+x+sup(a)+' : '+x+sup(n)+' là',right:x+sup(a-n),wrong:[x+sup(a+n),x+sup(a-n+1),x+sup(a*n),x+sup(a-n+2)],exp:'Chia hai luỹ thừa cùng cơ số: giữ nguyên cơ số, trừ số mũ: '+a+' − '+n+' = '+(a-n)+', nên kết quả là '+x+sup(a-n)+'.'})}
  if(t===3)return mc({z:'B',l:1,q:'Kết quả của phép tính ('+x+sup(m)+')'+sup(k+1)+' là',right:x+sup(m*(k+1)),wrong:[x+sup(m+k+1),x+sup(m),x+sup(m*(k+1)+1),x+sup(m*(k+1)-1)],exp:'Luỹ thừa của một luỹ thừa: giữ nguyên cơ số, nhân hai số mũ: '+m+' · '+(k+1)+' = '+m*(k+1)+'.'});
  const a=rnd(1,5),b=rnd(2,7);return mc({z:'B',l:1,q:'Luỹ thừa bậc '+(k+1)+' của số hữu tỉ '+fraw(a,b)+', tức là '+'('+fraw(a,b)+')'+sup(k+1)+', bằng',right:fraw(pick([a+sup(k+1)]),b+sup(k+1)),wrong:[fraw(a+sup(k+1),b),fraw(a,b+sup(k+1)),fraw(a*(k+1),b*(k+1))],exp:'Luỹ thừa của một thương: ('+fraw('a','b')+')'+sup('n')+' = '+fraw('a'+sup('n'),'b'+sup('n'))+' (b ≠ 0).'})},'luythua');
add('B',1,'mc',()=>{
  const a=rnd(2,9),b=rnd(2,9),c=rnd(2,9);const x=pick(['x','y']);
  if(Math.random()<.5)return mc({z:'B',l:1,q:'Bỏ dấu ngoặc: '+MN+'('+a+' '+MN+' '+b+' + '+c+') bằng',right:MN+a+' + '+b+' '+MN+' '+c,wrong:[MN+a+' '+MN+' '+b+' + '+c,MN+a+' + '+b+' + '+c,a+' '+MN+' '+b+' + '+c],exp:'Khi bỏ dấu ngoặc có dấu "−" đằng trước, ta đổi dấu tất cả các số hạng trong ngoặc: −('+a+' − '+b+' + '+c+') = −'+a+' + '+b+' − '+c+'.'});
  const s=rnd(1,6),t=rnd(7,15);return mc({z:'B',l:1,q:'Từ '+x+' + '+s+' = '+t+', quy tắc chuyển vế cho ta',right:x+' = '+t+' '+MN+' '+s,wrong:[x+' = '+t+' + '+s,x+' = '+MN+t+' '+MN+' '+s,x+' = '+s+' '+MN+' '+t],exp:'Chuyển vế một số hạng từ vế này sang vế kia ta phải đổi dấu số hạng đó: '+x+' = '+t+' − '+s+' = '+(t-s)+'.'})},'quytac');
add('B',1,'mc',()=>{ /* thứ tự thực hiện phép tính */
  const a=rnd(2,9),b=rnd(2,9),c=rnd(2,6);const t=rnd(1,3);
  if(t===1)return mc({z:'B',l:1,q:'Giá trị của biểu thức '+a+' + '+b+' · '+c+' là',right:a+b*c,wrong:[(a+b)*c,a+b+c,a*b+c],exp:'Nhân trước, cộng sau: '+b+' · '+c+' = '+b*c+'; '+a+' + '+b*c+' = '+(a+b*c)+'.'});
  if(t===2)return mc({z:'B',l:1,q:'Trong biểu thức có các dấu ngoặc ( ), [ ], { }, ta thực hiện phép tính theo thứ tự nào?',right:'( ) → [ ] → { }',wrong:['{ } → [ ] → ( )','[ ] → ( ) → { }','( ) → { } → [ ]'],exp:'Quy ước: thực hiện trong ngoặc tròn trước, rồi ngoặc vuông, cuối cùng ngoặc nhọn.'});
  const d=rnd(2,5);return mc({z:'B',l:1,q:'Giá trị của biểu thức '+a*d+' '+MN+' '+b+' · '+c+' + '+d+' là',right:a*d-b*c+d,wrong:[(a*d-b)*c+d,a*d-b*(c+d),a*d-b*c-d],exp:'Nhân trước: '+b+' · '+c+' = '+b*c+'. Rồi tính từ trái sang phải: '+a*d+' − '+b*c+' + '+d+' = '+(a*d-b*c+d)+'.'})},'thutu');
add('B',1,'mc',()=>{
  const d=rnd(4,13);let a=rnd(1,d-1),b=rnd(1,d-1);while(a===b||a*b===a+b)b=rnd(1,d-1);
  return mc({z:'B',l:1,q:'Kết quả của phép tính '+fraw(a,d)+' + '+fraw(b,d)+' là',right:fraw(a+b,d),wrong:[fraw(a+b,d+d),fraw(a*b,d),fraw(a+b,2*d+1)],exp:'Cộng hai phân số cùng mẫu: cộng tử, giữ nguyên mẫu: '+fraw(a+'+'+b,d)+' = '+fraw(a+b,d)+(gcd(a+b,d)>1?' = '+fh(R(a+b,d)):'')+'.'})},'cong');

add('B',2,'sa',()=>{ /* cộng trừ hai phân số khác mẫu */
  let x,y;do{x=rq([2,3,4,5,6,8,9],8);y=rq([2,3,4,5,6,8,9],8)}while(x.d===y.d);
  const sg=Math.random()<.5;const r=sg?fadd(x,y):fsub(x,y);const L=x.d*y.d/gcd(x.d,y.d);
  return SA('B',2,'Tính: '+fh(x)+' '+(sg?'+':MN)+' '+fp(y)+' (viết kết quả dưới dạng phân số tối giản hoặc số thập phân).',r,'MSC = '+L+': '+fh(x)+' = '+fu(x.n*L/x.d,L)+'; '+fh(y)+' = '+fu(y.n*L/y.d,L)+'. Khi đó '+fu(x.n*L/x.d,L)+' '+(sg?'+':MN)+' '+fp(R(y.n*L/y.d,L)).replace(/^\((.*)\)$/,'$1')+' = '+fu((sg?1:-1)*0+(x.n*L/x.d+(sg?1:-1)*y.n*L/y.d),L)+' = '+fh(r)+'.')},'cong');
add('B',2,'sa',()=>{ /* luỹ thừa của số hữu tỉ */
  const x=R((Math.random()<.5?-1:1)*rnd(1,4),rnd(2,5));const k=rnd(2,3);if(x.d===1)return G.B[2][1]();
  const r=fpow(x,k);
  return SA('B',2,'Tính: ('+fh(x)+')'+sup(k)+' (viết kết quả dưới dạng phân số hoặc số thập phân).',r,'('+fh(x)+')'+sup(k)+' = '+Array(k).fill(fp(x)).join(' · ')+' = '+fh(r)+'. (Luỹ thừa bậc '+(k%2?'lẻ':'chẵn')+' của số '+(x.n<0?'âm':'dương')+' nên kết quả '+(r.n<0?'âm':'dương')+'.)')},'luythua');
add('B',2,'sa',()=>{ /* nhân chia */
  const x=rq([2,3,4,5,6,8],9),y=rq([2,3,4,5,6,8],9);const mul=Math.random()<.5;const r=mul?fmul(x,y):fdiv(x,y);
  return SA('B',2,'Tính: '+fp(x)+' '+(mul?'·':':')+' '+fp(y)+' (viết kết quả dưới dạng phân số tối giản hoặc số thập phân).',r,mul?'Nhân tử với tử, mẫu với mẫu: '+fp(x)+' · '+fp(y)+' = '+fh(r)+'.':'Chia cho một số khác 0 bằng nhân với số nghịch đảo: '+fp(x)+' · '+fh(R(y.d,y.n))+' = '+fh(r)+'.')},'nhan');
add('B',2,'mc',()=>{ /* chuyển vế */
  const a=rqp([2,3,4,5],7),b=rq([2,3,4,5],7);const sg=Math.random()<.5;
  const x=sg?fadd(b,a):fsub(b,a);
  return mc({z:'B',l:2,q:'Tìm x, biết: x '+(sg?MN:'+')+' '+fh(a)+' = '+fh(b),right:fh(x),wrong:[fh(sg?fsub(b,a):fadd(b,a)),fh(fneg(x)),fh(R(x.n+1,x.d)),fh(fadd(x,R(1,2))),fh(fsub(x,R(1,3))),fh(fadd(x,R(2,3)))],exp:'Chuyển vế: x = '+fh(b)+' '+(sg?'+':MN)+' '+fh(a)+' = '+fh(x)+'.'})},'chuyenve');
add('B',2,'tf',()=>{
  const a=rnd(2,5),m=rnd(2,5),n=rnd(2,4),b=rnd(2,4);const x=R(rnd(1,4),rnd(2,5));
  return tf({z:'B',l:2,q:'Em hãy cho biết mỗi phát biểu sau đúng hay sai:',items:[
    tfi(1,a+sup(m)+' · '+a+sup(n)+' = '+a+sup(m+n),a+sup(m)+' · '+a+sup(n)+' = '+a+sup(m*n),'Đúng: cộng số mũ.','Sai: phải cộng số mũ: '+m+' + '+n+' = '+(m+n)+'.'),
    tfi(2,'('+a+sup(m)+')'+sup(n)+' = '+a+sup(m*n),'('+a+sup(m)+')'+sup(n)+' = '+a+sup(m+n),'Đúng: nhân hai số mũ.','Sai: luỹ thừa của luỹ thừa thì nhân hai số mũ: '+m+' · '+n+' = '+m*n+'.'),
    tfi(2,MN+'('+b+' '+MN+' '+a+') = '+(a-b),MN+'('+b+' '+MN+' '+a+') = '+(b-a),'Đúng: đổi dấu các số hạng trong ngoặc.','Sai: '+MN+'('+b+' '+MN+' '+a+') = '+MN+b+' + '+a+' = '+(a-b)+'.'),
    tfi(2,fh(x)+' · 0 = 0',fh(x)+' · 0 = '+fh(x),'Đúng: mọi số nhân với 0 đều bằng 0.','Sai: mọi số nhân với 0 đều bằng 0.')]})},'tfb');

add('B',3,'sa',()=>{ /* biểu thức nhiều bước */
  const a=rqp([2,3,4,5],7),b=rq([2,3,4,5,6],7),c=rqp([2,3,5],6),d=rqp([2,3,4],6);
  const r1=fmul(b,c);const r2=fadd(a,r1);const r=fsub(r2,d);

const ang=(a,b,c)=>'∠'+a+b+c;              /* ∠xOy */
const ag=(P,k)=>'∠'+P+sub(k);              /* ∠A₁ */
/* các cặp góc khi đường thẳng c cắt a (tại A) và b (tại B): vị trí 1..4 */
const PAIRS=[
  {a:'A1',b:'B1',t:'đồng vị',eq:true},{a:'A2',b:'B2',t:'đồng vị',eq:true},{a:'A3',b:'B3',t:'đồng vị',eq:true},{a:'A4',b:'B4',t:'đồng vị',eq:true},
  {a:'A3',b:'B1',t:'so le trong',eq:true},{a:'A2',b:'B4',t:'so le trong',eq:true},
  {a:'A1',b:'B3',t:'so le ngoài',eq:true},{a:'A4',b:'B2',t:'so le ngoài',eq:true},
  {a:'A2',b:'B1',t:'trong cùng phía',eq:false},{a:'A3',b:'B4',t:'trong cùng phía',eq:false},
  {a:'A1',b:'B2',t:'ngoài cùng phía',eq:false},{a:'A4',b:'B3',t:'ngoài cùng phía',eq:false}];
const nm=k=>ag(k[0],k[1]);
function angVal(key,th){return (['1','3'].includes(key[1]))?th:180-th}
function tlTh(){return pick([rnd(38,78),rnd(102,142)])}   /* góc θ = A₁, tránh gần 90° */

/* ---------- hình: ba điểm thẳng hàng U,O,T và tia OV ---------- */
function figKB(L,th){const O=[110,104];let g=SV.ln(pp(O,92,180),pp(O,92,0));g+=SV.ln(O,pp(O,78,th));g+=SV.dot(O)+SV.tx([O[0]+3,O[1]+16],L[1]);g+=SV.tx(pp(O,104,180),L[0])+SV.tx(pp(O,104,0),L[2])+SV.tx(pp(O,92,th),L[3]);return SV.wrap(g)}
/* hai đường thẳng cắt nhau tại O */
function figDD(L,a1,a2){const O=[110,76];let g='';const ds=[a1,a2,a1+180,a2+180];ds.forEach((a,i)=>{g+=SV.ln(O,pp(O,Math.min(88,60/Math.max(.45,Math.abs(Math.sin(a*D2R))))*1,a));g+=SV.tx(pp(O,Math.min(98,(60/Math.max(.45,Math.abs(Math.sin(a*D2R))))+12),a),L[i])});g+=SV.dot(O)+SV.tx([O[0]+3,O[1]+17],'O');return SV.wrap(g)}
/* tia phân giác: Ox (0°), Oy (2α), Oz (α) */
function figPG(L,al,show){const O=[34,120];let g='';[[0,L[0]],[al*2,L[1]],[al,L[2]]].forEach(([a,n])=>{const L=Math.min(150,100/Math.max(.5,Math.sin(Math.min(al*2,170)*D2R)));g+=(a===0?SV.ln(O,pp(O,150,0)):SV.ln(O,pp(O,L,a)))+SV.tx(pp(O,(a===0?150:L)+13,a),n)});
  g+=SV.arc(O,34,2,al-2,'ar mk')+SV.arc(O,34,al+2,2*al-2,'ar mk')+SV.arc(O,40,2,al-2,'ar mk')+SV.arc(O,40,al+2,2*al-2,'ar mk');g+=SV.dot(O)+SV.tx([O[0]-4,O[1]+17],'O');return SV.wrap(g)}

/* ---------- D1 (Biết) ---------- */

  const sg=figKB([U,'O',T,V],th);
  const right=ang(U,'O',V)+' và '+ang(V,'O',T);
  return mc({z:'D',l:1,q:'Cặp góc kề bù có trong hình dưới đây là',svg:sg,right,wrong:[ang(U,'O',V)+' và '+ang(U,'O',T),ang(U,'O',T)+' và '+ang(V,'O',T),ang(U,'O',T)+' và '+ang(T,'O',U)],
    exp:'Hai góc kề bù có một cạnh chung và hai cạnh còn lại là hai tia đối nhau. Ở đây '+ang(U,'O',V)+' và '+ang(V,'O',T)+' có chung cạnh OV, còn OU và OT là hai tia đối nhau.'})},'kb');

add('D',1,'mc',()=>{ /* tên cặp góc */

add('D',2,'sa',()=>{ /* phân giác */
  const l=pl(3);const v=rnd(20,80);const t=Math.random()<.5;

  return sa({z:'D',l:2,q:'Cho '+ang(l[0],'A',l[1])+' = '+v+'° và tia A'+l[1]+' là tia phân giác của '+ang(l[0],'A',l[2])+'. Tính số đo góc '+ang(l[0],'A',l[2])+' (đơn vị: độ).',ans:2*v,exp:'A'+l[1]+' là phân giác của '+ang(l[0],'A',l[2])+' nên '+ang(l[0],'A',l[2])+' = 2 · '+ang(l[0],'A',l[1])+' = 2 · '+v+'° = '+2*v+'°.'})},'pgtinh');
function parQ(l,level,asSa){ /* câu hỏi dùng hình hai đường thẳng song song */
  const p=pick(PAIRS);const th=tlTh();const given=Math.random()<.5;
  const gv=angVal(p.a,th);const known=p.a,ask=p.b;const kv=gv, av=p.eq?gv:180-gv;
  const sg=SV.wrap(SV.par(th,{lab:{[known]:kv+'°',[ask]:'?'}}));
  const q='Cho hình vẽ, biết a // b và '+nm(known)+' = '+kv+'°. Tính số đo '+nm(ask)+' (đơn vị: độ).';
  const exp='Vì a // b nên '+(p.eq?nm(known)+' = '+nm(ask)+' (hai góc '+p.t+' bằng nhau)':nm(known)+' + '+nm(ask)+' = 180° (hai góc '+p.t+' bù nhau)')+'. Suy ra '+nm(ask)+' = '+(p.eq?kv+'°':'180° − '+kv+'° = '+av+'°')+'.';
  return{q,sg,ans:av,exp,p}
}

/* câu đúng–sai cho hình học (Câu 14): a biết (kề bù), b, c hiểu (kề bù, phân giác), d hiểu (song song) */
function tfD(){
  const al=2*rnd(20,40);const bay=180-al;const beta=bay/2;
  /* hình: đường thẳng xy, A trên xy, tia AB tạo xAB=al, AC là phân giác BAy, C sao cho BC // xy */
  const A=[110,36];const d1=al;const Bp=pp(A,86,180+al);const bAng=beta;const lenC=(Bp[1]-A[1])/Math.sin(bAng*D2R);const Cp=[A[0]+lenC*Math.cos(bAng*D2R),A[1]+lenC*Math.sin(bAng*D2R)];
  let g=SV.ln([14,A[1]],[206,A[1]])+SV.ln(A,Bp)+SV.ln(A,Cp)+SV.ln(Bp,Cp);
  g+=SV.tx([16,A[1]-9],'x')+SV.tx([204,A[1]-9],'y')+SV.tx([A[0],A[1]-10],'A')+SV.tx([Bp[0]-9,Bp[1]+14],'B')+SV.tx([Cp[0]+10,Cp[1]+14],'C');
  g+=SV.arc(A,22,180,180+al,'ar')+SV.tx(pp(A,36,180+al/2),al+'°','dm sm');
  g+=SV.arc(Cp,20,180-beta,180,'ar');g+=SV.tx([Cp[0]-34,Cp[1]-7],beta+'°','dm sm');
  const q='Cho hình vẽ, biết ∠xAB = '+al+'°, tia AC là tia phân giác của ∠yAB và ∠ACB = '+beta+'°. Các khẳng định sau đúng hay sai?';
  const items=[
    tfi(1,'∠xAB và ∠BAy là hai góc kề bù','∠xAB và ∠BAC là hai góc kề bù','Đúng: hai góc có chung cạnh AB và hai cạnh Ax, Ay là hai tia đối nhau.','Sai: ∠xAB và ∠BAy mới là hai góc kề bù (cạnh còn lại phải là tia đối của Ax).'),

function make(z,l,type,tag){let pool=G[z][l];if(type)pool=pool.filter(f=>f.t===type);if(tag)pool=pool.filter(f=>f.tag===tag);if(!pool.length)throw new Error('Không có generator '+z+l+type+tag);return pick(pool)()}
function makeSet(z,l,n){
  const pool=shuffle(G[z][l]);const out=[];let last=null;let i=0;
  while(out.length<n){let f=pool[i%pool.length];i++;if(f===last&&pool.length>1)continue;last=f;out.push(f())}
  if(!out.some(q=>q.type==='sa')){const s=G[z][l].filter(f=>f.t==='sa');if(s.length)out[n-1]=pick(s)()}
  return out;
}
/* ---------- chấm ---------- */
function parseNum(s){
  s=String(s).trim().replace(/[\s ]/g,'').replace(/[−–—]/g,'-');
  let m=s.match(/^(-?\d+(?:[.,]\d+)?)\/(-?\d+(?:[.,]\d+)?)/);
  if(m){const a=parseFloat(m[1].replace(',','.')),b=parseFloat(m[2].replace(',','.'));return b?a/b:NaN}
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  s=s.replace(',','.');m=s.match(/^-?\d+(\.\d+)?/);return m?parseFloat(m[0]):NaN}
function checkSA(q,input){
  if(q.kind==='text')return String(input).replace(/\s/g,'').toUpperCase()===String(q.ans).toUpperCase();
  if(q.kind==='list'){const got=[...new Set((String(input).replace(/[−–]/g,'-').match(/-?\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.'))))].sort((a,b)=>a-b);const exp=[...new Set(q.ans)].sort((a,b)=>a-b);return got.length===exp.length&&got.every((v,i)=>Math.abs(v-exp[i])<1e-9)}
  const v=parseNum(input);return Math.abs(v-q.ans)<1e-6;
}
function ansText(q){if(q.type==='mc')return q.opts[q.ans];if(q.kind==='list')return q.ans.join('; ');return (q.at!==undefined?q.at:dec(q.ans))+(q.unit?' '+q.unit:'')}

function scoreExam(ex,ans){
  let s1=0,s2=0,s3=0;
  ex.p1.forEach((q,i)=>{if(ans.p1[i]===q.ans)s1+=0.25});

function withSeed(seed,fn){
  const orig=Math.random;let s=(seed*2654435761)>>>0||1;
  Math.random=function(){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296};
  try{return fn()}finally{Math.random=orig}
}

  m.innerHTML='<div class="qwrap"><div class="qtop"><button class="x" data-act="quit" title="Thoát">✕</button><div class="pbar"><i style="width:'+(Z.i/Z.qs.length*100)+'%"></i></div><div class="combo">'+(Z.combo>=2?'🔥 x'+Z.combo:'')+'</div></div>'+

function qBody(q,idp){
  idp=idp||'';let h='<div class="qtxt">'+q.q+'</div>'+(q.svg||'');
  if(q.type==='mc')h+='<div class="opts">'+q.opts.map((o,i)=>'<button class="opt" data-act="pick" data-i="'+i+'" data-q="'+idp+'"><span class="L">'+'ABCD'[i]+'</span><span>'+o+'</span></button>').join('')+'</div>';
  else if(q.type==='sa')h+='<div class="sain"><input id="sa'+idp+'" data-act="saIn" data-q="'+idp+'" autocomplete="off" inputmode="'+(q.kind==='text'?'text':'decimal')+'" placeholder="'+(q.kind==='list'?'VD: 70; 110':q.kind==='text'?'Nhập đáp án':'Đáp số (VD: 0,5 hoặc −3/5)')+'">'+(q.unit?'<span class="u">'+q.unit+'</span>':'')+'</div>'+(q.hint&&!idp?'<div class="muted" style="margin-top:6px;font-size:14px">💡 Gợi ý: '+q.hint+'</div>':'');
  else h+=q.items.map((it,j)=>'<div class="tfrow" id="tf'+idp+'_'+j+'"><div class="t"><span class="lv2">'+'abcd'[j]+')</span>'+it.t+'</div><div class="tfbtn"><button class="T" data-act="tf" data-j="'+j+'" data-v="1" data-q="'+idp+'">Đúng</button><button class="F" data-act="tf" data-j="'+j+'" data-v="0" data-q="'+idp+'">Sai</button></div></div>').join('');
  return h;
}
function readyToCheck(){const q=Z.qs[Z.i];let ok=false;if(q.type==='mc')ok=Z.sel!==null;else if(q.type==='sa')ok=$('#sa').value.trim()!=='';else ok=Z.sel.every(x=>x!==null);$('#chk').disabled=!ok}
function doCheck(){
  if(Z.checked)return;const q=Z.qs[Z.i];Z.checked=true;let full=false,frac=0;
  if(q.type==='mc'){full=Z.sel===q.ans;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add('right');else if(i===Z.sel)b.classList.add('wrong')});frac=full?1:0}
  else if(q.type==='sa'){const inp=$('#sa');full=checkSA(q,inp.value);inp.classList.add(full?'right':'wrong');inp.disabled=true;frac=full?1:0}
  else{let c=0;q.items.forEach((it,j)=>{const ok=Z.sel[j]===it.v;if(ok)c++;const r=$('#tf_'+j);r.classList.add(ok?'right':'wrong');r.querySelectorAll('button').forEach(b=>b.disabled=true);r.insertAdjacentHTML('beforeend','<div class="why">'+(ok?'✅ ':'❌ ')+it.why+'</div>')});full=c===4;frac=c===4?1:c===3?.5:0;Z.tfc=c}
  Z.pts+=frac;Z.got.push(frac);P.cnt++;if(full){P.right++;Z.combo++;P.maxCombo=Math.max(P.maxCombo,Z.combo);if(Z.combo>=5)giveBadge('c5');if(Z.combo>=10)giveBadge('c10')}else if(frac===0||q.type!=='tf')Z.combo=0;
  const gain=q.type==='tf'?Z.tfc*3:(full?10+Math.min(Z.combo,5)*2:0);Z.xp+=gain;addXP(gain);
  full?sOK():sNO();if(full&&Z.combo>=3)confetti(40);
  const ex=q.type==='mc'?q.exp:q.type==='sa'?'Đáp án: <b>'+ansText(q)+'</b>. '+q.exp:'';
  $('#fb').innerHTML='<div class="fb '+(full?'ok':'no')+'">'+(q.type==='tf'?(full?'🎉 Đúng cả 4 ý! +'+gain+' XP':'Đúng '+Z.tfc+'/4 ý. +'+gain+' XP'):(full?'✅ '+owl('ok')+' +'+gain+' XP':'❌ '+owl('no')))+(ex?'<span class="exp">'+ex+'</span>':'')+'</div>';
  const last=Z.i===Z.qs.length-1;const b=$('#chk');b.textContent=last?'Xem kết quả 🏁':'Câu tiếp theo ➜';b.dataset.act='next';b.disabled=false;b.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* số cần phân loại: [html, hữu tỉ?, lời giải] */
function randNum(){
  const t=rnd(1,9);
  if(t===1){const n=pick(NSQ.slice(0,40));return[rt(n),false,rt(n)+' không là bình phương của số hữu tỉ nào nên là số thập phân vô hạn không tuần hoàn.']}
  if(t===2){const n=pick(SQ.filter(x=>x<300));return[rt(n),true,rt(n)+' = '+Math.sqrt(n)+' là số nguyên nên là số hữu tỉ.']}
  if(t===3){const r=rq([3,7,9,11,12,13],9);return[fh(r),true,'Có dạng phân số a/b (b ≠ 0) nên là số hữu tỉ (viết được thành số thập phân vô hạn tuần hoàn).']}
  if(t===4){const x=R(rnd(-199,199)||1,pick([10,100]));return[dec(fval(x)),true,'Số thập phân hữu hạn là số hữu tỉ.']}
  if(t===5){const d=rnd(1,9);return['0,('+d+')',true,'Số thập phân vô hạn tuần hoàn là số hữu tỉ.']}
  if(t===6)return[pick(['π','−π','2π','π + 1']),false,'π là số vô tỉ (số thập phân vô hạn không tuần hoàn).'];
  if(t===7){const n=pick(NSQ.slice(0,40));return[MN+rt(n),false,MN+rt(n)+' là số đối của số vô tỉ '+rt(n)+', nên cũng là số vô tỉ.']}
  if(t===8){const n=rnd(2,9);return[String(rnd(-9,9)),true,'Số nguyên là số hữu tỉ.']}
  const d=rnd(2,5),k=pick([1,2,3]);return['1,'+'0'.repeat(k)+'1'.repeat(1)+pick(['2','3','5'])+'…'.slice(0,0),true,'Số thập phân hữu hạn là số hữu tỉ.']
}
let BG=null;
function vBlitz(m){
  BG={t:45,score:0,combo:0,total:0,over:false};
  m.innerHTML='<div class="qwrap"><div class="card game"><div class="qtop"><button class="x" data-act="go" data-v="games">✕</button><div class="pbar"><i id="bt" style="width:100%"></i></div><b id="bsc">0</b></div><div class="muted" id="bc"></div><div style="font-size:60px" id="ship">☄️</div><div class="qtxt">Con số này là số nào?</div><div class="bignum" id="bn"></div><div class="yn"><button class="yes" data-act="byn" data-v="1">ℚ Hữu tỉ (H)</button><button class="no" data-act="byn" data-v="0">√ Vô tỉ (V)</button></div></div></div>';
  nextBlitz();const t0=Date.now();
  timers.push(setInterval(()=>{const left=45-(Date.now()-t0)/1000-(BG.pen||0);BG.t=left;const b=$('#bt');if(b)b.style.width=Math.max(0,left/45*100)+'%';if(left<=0&&!BG.over)endBlitz()},100));
}
function nextBlitz(){const x=randNum();BG.cur=x;$('#bn').innerHTML=x[0]}
function ansBlitz(v){
  if(BG.over)return;const ok=(!!v)===BG.cur[1];
  if(ok){BG.combo++;BG.score+=1+(BG.combo>=5?1:0);sOK();$('#ship').style.transform='translateX('+Math.min(BG.score*6,90)+'px)'}else{BG.combo=0;BG.pen=(BG.pen||0)+2;sNO();toast('❌ '+BG.cur[2]+' (trừ 2 giây)')}
  $('#bsc').textContent=BG.score;$('#bc').textContent=BG.combo>=3?'🔥 Chuỗi '+BG.combo:'';nextBlitz();
}
function endBlitz(){
  BG.over=true;stopTimers();const s=BG.score;const nb=s>P.best.blitz;if(nb)P.best.blitz=s;if(s>=15)giveBadge('blitz');addXP(s*2);touchDay();saveP();confetti(s>=10?100:30);sWIN();
  $('#main').innerHTML='<div class="qwrap"><div class="card res"><div class="big">☄️</div><h2>Hết giờ!</h2><div class="score">'+s+' điểm</div><p>'+(nb?'🎉 Kỉ lục mới!':'Kỉ lục của bạn: '+P.best.blitz)+' · +'+s*2+' XP</p><div class="foot" style="justify-content:center"><button class="btn" data-act="go" data-v="blitz">Chơi lại</button><button class="btn ghost" data-act="go" data-v="games">Trò chơi khác</button></div></div></div>';
}
let DT=null;
const DET_SEC=15;
function vDet(m){DT={i:0,score:0,over:false};detRound(m)}
function detRound(m){
  m=m||$('#main');
  const pools=[G.D[1].filter(f=>f.t==='mc'&&['kb','dd','cap'].includes(f.tag)),G.D[2].filter(f=>f.t==='mc'),G.D[1].filter(f=>f.tag==='pg')];
  const q=pick(pools[DT.i<3?0:DT.i<7?1:rnd(0,2)])();DT.q=q;DT.t0=Date.now();DT.locked=false;
  m.innerHTML='<div class="qwrap"><div class="card game"><div class="qtop"><button class="x" data-act="go" data-v="games">✕</button><div class="pbar"><i style="width:'+DT.i*10+'%"></i></div><b>'+DT.score+'</b></div><div class="qtxt">📐 Vụ án '+(DT.i+1)+'/10</div><div class="qtxt">'+q.q+'</div>'+(q.svg||'')+'<div class="timer"><i id="dtm"></i></div><div class="opts">'+q.opts.map((o,i)=>'<button class="opt" data-act="dpick" data-k="'+i+'"><span class="L">'+'ABCD'[i]+'</span><span>'+o+'</span></button>').join('')+'</div></div></div>';
  const bar=$('#dtm');const t0=DT.t0;timers.push(setInterval(()=>{const f=Math.max(0,1-(Date.now()-t0)/(DET_SEC*1000));if(bar)bar.style.transform='scaleX('+f+')'},80));
  timers.push(setTimeout(()=>{if(!DT.locked&&view==='det')detAnswer(null)},DET_SEC*1000));
}
function detAnswer(k){
  if(DT.locked)return;DT.locked=true;stopTimers();const q=DT.q;const ok=k!==null&&Number(k)===q.ans;const dt=(Date.now()-DT.t0)/1000;
  if(ok){DT.score+=Math.max(4,Math.round(12-dt*.6));sOK()}else sNO();
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add('right');else if(k!==null&&i===Number(k))b.classList.add('wrong')});
  const fbk=document.querySelector('.card.game');if(fbk)fbk.insertAdjacentHTML('beforeend','<div class="fb '+(ok?'ok':'no')+'" style="margin-top:10px">'+(ok?'✅ Chính xác!':'❌ Chưa đúng.')+'<span class="exp">'+q.exp+'</span></div>');
  setTimeout(()=>{if(view!=='det')return;DT.i++;if(DT.i>=10)endDet();else detRound()},ok?1200:2600);
}
function endDet(){
  const s=DT.score;const nb=s>P.best.det;if(nb)P.best.det=s;if(s>=80)giveBadge('det');addXP(Math.round(s/2));touchDay();saveP();confetti(s>=60?100:30);sWIN();
  $('#main').innerHTML='<div class="qwrap"><div class="card res"><div class="big">📐</div><h2>Phá án xong!</h2><div class="score">'+s+' / 120</div><p>'+(nb?'🎉 Kỉ lục mới!':'Kỉ lục của bạn: '+P.best.det)+' · +'+Math.round(s/2)+' XP</p><div class="foot" style="justify-content:center"><button class="btn" data-act="go" data-v="det">Chơi lại</button><button class="btn ghost" data-act="go" data-v="games">Trò chơi khác</button></div></div></div>';
}

  '<h2>Huy hiệu ('+Object.keys(P.badges).length+'/'+BADGES.length+')</h2><div class="badges">'+BADGES.map(b=>'<div class="bd '+(P.badges[b[0]]?'got':'')+'"><div class="e">'+b[1]+'</div><b>'+b[2]+'</b><small>'+b[3]+'</small></div>').join('')+'</div>'+
  '<div class="center" style="margin-top:24px"><button class="btn ghost sm" data-act="reset">Xoá toàn bộ tiến trình</button></div>';
}

  m.innerHTML='<h2 style="margin-top:6px">📖 Đề giữa kì 1 gồm những gì?</h2><div class="card"><p style="margin-top:0"><b>Phạm vi:</b> Số hữu tỉ · Số thực · Góc và đường thẳng song song (hết bài <i>Hai đường thẳng song song và tiên đề Euclid</i>). Thời gian làm bài: <b>90 phút</b>. Điểm: trắc nghiệm 7,0 + tự luận 3,0.</p>'+
  '<table class="m"><tr><th>Phần</th><th>Số câu</th><th>Điểm</th><th>Nội dung</th></tr><tr><td>1. Nhiều lựa chọn</td><td>12</td><td>3,0</td><td>Số hữu tỉ, số đối, thứ tự (4 câu) · căn bậc hai, số vô tỉ (2 câu) · góc kề bù, đối đỉnh, phân giác (3 câu) · hai đường thẳng song song, tiên đề Euclid (3 câu) — đều ở mức biết</td></tr><tr><td>2. Đúng – sai</td><td>2 (mỗi câu 4 ý)</td><td>2,0</td><td>Câu 13: số hữu tỉ (biết, hiểu, vận dụng) · Câu 14: góc và đường thẳng song song (biết, hiểu)</td></tr><tr><td>3. Trả lời ngắn</td><td>8 (0,25đ/câu)</td><td>2,0</td><td>Số hữu tỉ nhỏ nhất, số đối · tính giá trị biểu thức, tìm x · làm tròn căn bậc hai · tính số đo góc</td></tr><tr><td>Tự luận</td><td>3 bài (23, 24, 25)</td><td>3,0</td><td>Tính giá trị biểu thức, tính hợp lí · chứng minh song song, tính góc · tính tổng dãy số (vận dụng cao)</td></tr></table></div>'+
  '<h2>Mẹo làm bài</h2><div class="grid g2"><div class="card">🧮 <b>Phép tính:</b> luỹ thừa → nhân, chia → cộng, trừ; có ngoặc thì ( ) → [ ] → { }. Chia cho một số = nhân với nghịch đảo.</div><div class="card">📏 <b>So sánh:</b> quy đồng mẫu dương rồi so sánh tử, hoặc đổi sang số thập phân.</div><div class="card">√ <b>Số thực:</b> √a luôn không âm; số vô tỉ là số thập phân vô hạn không tuần hoàn. Làm tròn độ chính xác 0,05 ⇒ đến hàng phần mười.</div><div class="card">∠ <b>Góc:</b> kề bù thì tổng 180°; đối đỉnh thì bằng nhau; phân giác chia đôi góc. Song song ⇒ đồng vị, so le trong bằng nhau; trong cùng phía bù nhau.</div></div>'+
  '<div class="center" style="margin-top:20px"><button class="btn" data-act="go" data-v="map">Cất cánh thôi! 🚀</button></div>';
}

/* ---------- XỬ LÝ SỰ KIỆN ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='go'){e.preventDefault();go(t.dataset.v)}
  else if(a==='snd'){P.snd=!P.snd;saveP();$('#sndb').textContent=P.snd?'🔊':'🔇'}
  else if(a==='setname'){const v=$('#nm').value.trim();if(v){P.name=v;saveP();touchDay();go('home')}else toast('Hãy nhập biệt danh nhé!')}
  else if(a==='play')startZone(t.dataset.z,Number(t.dataset.l));
  else if(a==='quit'){if(confirm('Thoát ải này? Kết quả sẽ không được lưu.'))go('map')}
  else if(a==='pick'){
    const q=t.dataset.q;if(view==='quiz'){if(Z.checked)return;Z.sel=Number(t.dataset.i);document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel');readyToCheck()}
    else if(view==='examrun'){const[p,i]=q.split('_').map(Number);EA.p1[i]=Number(t.dataset.i);document.querySelectorAll('#e1_'+i+' .opt').forEach(b=>b.classList.remove('sel'));t.classList.add('sel');paintNums()}}
  else if(a==='tf'){
    const j=Number(t.dataset.j),v=t.dataset.v==='1';const q=t.dataset.q;
    if(view==='quiz'){if(Z.checked)return;Z.sel[j]=v;const row=$('#tf_'+j);row.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));t.classList.add('sel');readyToCheck()}
    else if(view==='examrun'){const[p,i]=q.split('_').map(Number);EA.p2[i][j]=v;const row=$('#tf'+q+'_'+j);row.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));t.classList.add('sel');paintNums()}}
  else if(a==='check')doCheck();
  else if(a==='next')nextQ();
  else if(a==='startexam')startExam(Number(t.dataset.n));
  else if(a==='submitexam')submitExam();
  else if(a==='jump'){e.preventDefault();const el=document.getElementById(t.dataset.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='tlfromexam'){startTL(0,EX.tl)}
  else if(a==='starttl')startTL(Number(t.dataset.n));
  else if(a==='tlhint'){const i=Number(t.dataset.i);TS.h[i]=(TS.h[i]||0);const hs=TL[i].hints;const box=$('#tlx'+i);if(TS.h[i]<hs.length){TS.h[i]++}
    let hh=hs.slice(0,TS.h[i]).map((x,k)=>'<div class="hint">💡 Gợi ý '+(k+1)+': '+x+'</div>').join('');box.querySelectorAll('.hint').forEach(n=>n.remove());box.insertAdjacentHTML('afterbegin',hh)}
  else if(a==='tlsol'){const i=Number(t.dataset.i);const tt=TL[i];const box=$('#tlx'+i);let v='';
    if(tt.kind){const inp=$('#tla'+i);const val=inp.value.trim();
      if(val){const q={kind:tt.kind,ans:tlFinal(tt)};const ok=checkSA(q,val);v='<div class="fb '+(ok?'ok':'no')+'" style="margin-top:10px">'+(ok?'✅ Đáp số của bạn đúng!':'❌ Đáp số chưa đúng – xem lời giải để tìm chỗ sai nhé.')+'</div>';if(ok)sOK();else sNO()}
      else v='<div class="note" style="margin-top:10px">Bạn chưa nhập đáp số – hãy thử làm trước rồi so với lời giải nhé.</div>'}
    box.querySelectorAll('.sol,.fb,.note,.self2').forEach(n=>n.remove());
    box.insertAdjacentHTML('beforeend',v+'<div class="sol"><b>Lời giải:</b><br>'+tt.sol+(tt.kind?'<br><b>Đáp số: '+(tt.kind==='list'?tt.ans.join('; '):(tt.at!==undefined?tt.at:dec(tlFinal(tt))))+'</b>':'')+'</div><div class="self self2"><span class="muted">Em tự chấm:</span><button data-act="tlself" data-i="'+i+'" data-s="1">✅ Đúng hết</button><button data-act="tlself" data-i="'+i+'" data-s="0.5">🟡 Đúng một phần</button><button data-act="tlself" data-i="'+i+'" data-s="0">❌ Chưa đúng</button></div>')}
  else if(a==='tlself'){const i=Number(t.dataset.i);TS.sc[TL[i].id]=Number(t.dataset.s);t.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));t.classList.add('on');$('#tltot').textContent=fmtScore(tlTotal())}
  else if(a==='tlfinish')finishTL();
  else if(a==='byn')ansBlitz(t.dataset.v==='1');
  else if(a==='dpick')detAnswer(t.dataset.k);
  else if(a==='reset'){if(confirm('Xoá hết sao, huy hiệu và điểm kinh nghiệm?')){localStorage.removeItem(KEY);P=loadP();go('home')}}
});
document.addEventListener('input',e=>{const t=e.target;if(view==='quiz'&&t.id==='sa')readyToCheck();else if(view==='examrun'&&t.dataset.act==='saIn'){const i=Number(t.dataset.q.split('_')[1]);EA.p3[i]=t.value;paintNums()}});
document.addEventListener('keydown',e=>{
  if(view==='blitz'&&BG&&!BG.over){if(e.key==='h'||e.key==='H'||e.key==='ArrowLeft')ansBlitz(true);if(e.key==='v'||e.key==='V'||e.key==='ArrowRight')ansBlitz(false)}
  if(view==='quiz'&&e.key==='Enter'&&Z&&Z.checked){const b=$('#chk');if(b&&b.dataset.act==='next')nextQ()}
});
P=loadP();touchDay();
document.body.innerHTML=chrome();go('home');
